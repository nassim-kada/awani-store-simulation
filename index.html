:root{--enamel:#0e4745;--deep:#08302f;--porcelain:#f6f4ee;--copper:#c4672f;--saffron:#f0b44c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--deep);color:var(--porcelain);font-family:Tj,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}
.wrap{width:100%;max-width:1500px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
.stage{background:var(--enamel);border-radius:18px;overflow:hidden;align-self:stretch;display:flex;align-items:center}
.stage svg{width:100%;height:auto;display:block;direction:ltr}
aside{background:#11141a;border:3px solid #2e3340;border-radius:18px;padding:14px;display:flex;flex-direction:column;min-height:430px}
h1{font:400 34px/1.3 Lz,sans-serif;text-align:center}
.last{height:112px;border-radius:12px;background:#1e2128;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px 0;text-align:center}
.last .n{font-size:18px;font-weight:700}
.last .p{font:400 54px/1.15 Lz,sans-serif;color:var(--saffron)}
.last.hit{animation:hit .5s}
@keyframes hit{0%{background:#2f6b46}100%{background:#1e2128}}
ul{list-style:none;flex:1}
li{display:flex;justify-content:space-between;gap:10px;font-size:17px;padding:7px 2px;border-bottom:1px solid #2e3340}
li b{white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--saffron);padding-top:6px;font-weight:700;font-size:20px}
.total strong{font:400 44px/1.2 Lz,sans-serif;color:var(--saffron);white-space:nowrap}
.bar{display:flex;gap:10px}
button{font:700 18px Tj,sans-serif;background:var(--saffron);color:#1c1407;border:0;border-radius:10px;padding:8px 24px;cursor:pointer}
button.alt{background:transparent;color:var(--porcelain);border:2px solid #ffffff55}
button:focus-visible{outline:3px solid #fff}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{min-height:0}}

\" rx=\"0\" fill=\"#c9d1d6\"/><rect x=\"158\" y=\"196\" width=\"14\" height=\"100\" rx=\"7\" fill=\"#ffffff55\"/>", "p12": "<rect x=\"60\" y=\"170\" width=\"86\" height=\"140\" rx=\"18\" fill=\"#a9d6df\"/><rect x=\"54\" y=\"144\" width=\"98\" height=\"32\" rx=\"10\" fill=\"#c4672f\"/><rect x=\"74\" y=\"190\" width=\"10\" height=\"100\" rx=\"5\" fill=\"#ffffffaa\"/><rect x=\"158\" y=\"120\" width=\"92\" height=\"190\" rx=\"18\" fill=\"#a9d6df\"/><rect x=\"152\" y=\"94\" width=\"104\" height=\"32\" rx=\"10\" fill=\"#1f6f6b\"/><rect x=\"172\" y=\"140\" width=\"10\" height=\"150\" rx=\"5\" fill=\"#ffffffaa\"/><rect x=\"264\" y=\"190\" width=\"78\" height=\"120\" rx=\"18\" fill=\"#a9d6df\"/><rect x=\"258\" y=\"164\" width=\"90\" height=\"32\" rx=\"10\" fill=\"#c4672f\"/><rect x=\"278\" y=\"210\" width=\"10\" height=\"80\" rx=\"5\" fill=\"#ffffffaa\"/>", "p13": "<path d=\"M60 180h280q-10 130-140 130T60 180z\" fill=\"#c4672f\" stroke=\"none\" stroke-width=\"0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"200\" cy=\"180\" rx=\"140\" ry=\"30\" fill=\"#9a4c1f\"/><ellipse cx=\"200\" cy=\"180\" rx=\"122\" ry=\"22\" fill=\"#e8a878\"/><rect x=\"150\" y=\"306\" width=\"100\" height=\"16\" rx=\"8\" fill=\"#9a4c1f\"/>", "p14": "<ellipse cx=\"200\" cy=\"250\" rx=\"160\" ry=\"52\" fill=\"#8b979f\"/><ellipse cx=\"200\" cy=\"242\" rx=\"160\" ry=\"52\" fill=\"#c9d1d6\"/><ellipse cx=\"200\" cy=\"240\" rx=\"128\" ry=\"38\" fill=\"#dde3e6\"/><path d=\"M112 168h46l-7 72q-16 8-32 0z\" fill=\"#e9b45a\" stroke=\"none\" stroke-width=\"0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"135\" cy=\"168\" rx=\"23\" ry=\"6\" fill=\"#f6d79a\"/><path d=\"M177 168h46l-7 72q-16 8-32 0z\" fill=\"#e9b45a\" stroke=\"none\" stroke-width=\"0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"200\" cy=\"168\" rx=\"23\" ry=\"6\" fill=\"#f6d79a\"/><path d=\"M242 168h46l-7 72q-16 8-32 0z\" fill=\"#e9b45a\" stroke=\"none\" stroke-width=\"0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"265\" cy=\"168\" rx=\"23\" ry=\"6\" fill=\"#f6d79a\"/>", "p15": "<rect x=\"86\" y=\"90\" width=\"26\" height=\"200\" rx=\"13\" fill=\"#b98a55\"/><ellipse cx=\"99\" cy=\"100\" rx=\"30\" ry=\"42\" fill=\"#b98a55\"/><rect x=\"188\" y=\"80\" width=\"22\" height=\"230\" rx=\"11\" fill=\"#b98a55\"/><rect x=\"168\" y=\"70\" width=\"62\" height=\"80\" rx=\"24\" fill=\"#c99c66\"/><path d=\"M300 90v210\" fill=\"none\" stroke=\"#2b3033\" stroke-width=\"18\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"300\" cy=\"120\" rx=\"40\" ry=\"44\" fill=\"none\"/><path d=\"M300 160q-70 -60 0 -100\" fill=\"none\" stroke=\"#8b979f\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M300 160q-35 -60 0 -100\" fill=\"none\" stroke=\"#8b979f\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M300 160q35 -60 0 -100\" fill=\"none\" stroke=\"#8b979f\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M300 160q70 -60 0 -100\" fill=\"none\" stroke=\"#8b979f\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "p16": "<rect x=\"52\" y=\"168\" width=\"70\" height=\"22\" rx=\"11\" fill=\"#2b3033\"/><rect x=\"278\" y=\"168\" width=\"70\" height=\"22\" rx=\"11\" fill=\"#2b3033\"/><path d=\"M92 160h216v110q0 40-40 40H132q-40 0-40-40z\" fill=\"#b8402f\" stroke=\"none\" stroke-width=\"0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"200\" cy=\"160\" rx=\"116\" ry=\"22\" fill=\"#8f2f22\"/><path d=\"M96 156q104-80 208 0z\" fill=\"#b8402f\" stroke=\"none\" stroke-width=\"0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"178\" y=\"84\" width=\"44\" height=\"30\" rx=\"12\" fill=\"#2b3033\"/><rect x=\"116\" y=\"190\" width=\"14\" height=\"90\" rx=\"7\" fill=\"#ffffff55\"/>"},PRODUCTS=[{"name": "طنجرة مطلية 24 سم", "price": 4800, "img": "p01"}, {"name": "إبريق شاي إينوكس", "price": 2400, "img": "p07"}, {"name": "طقم كؤوس 6 قطع", "price": 900, "img": "p06"}, {"name": "ترمس 1.5 لتر", "price": 2600, "img": "p11"}];
const NS='http://www.w3.org/2000/svg',scene=document.getElementById('scene'),$=id=>document.getElementById(id);
const money=n=>'<bdi dir="ltr">'+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+'</bdi> د.ج';
const COUNTER=470,SCAN={x:735,y:COUNTER};

/* ───── sound ───── */
let audio,soundOn=false;
function beep(){if(!soundOn)return;const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=1850;g.gain.value=.07;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.13);}

/* ───── scene ───── */
const line=(id,w,c)=>'<path id="'+id+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';
function shelf(y,keys){return '<rect x="40" y="'+y+'" width="1120" height="12" rx="4" fill="#082f2e"/>'+keys.map((k,i)=>'<g opacity=".38" transform="translate('+(70+i*138)+' '+(y-88)+') scale(.28)">'+ART[k]+'</g>').join('');}
function build(){
 scene.innerHTML=
 shelf(130,['p01','p07','p05','p12','p04','p13','p11','p06'])+shelf(250,['p13','p16','p14','p08','p03','p01','p05','p07'])+
 '<rect x="0" y="650" width="1200" height="110" fill="#0a3836"/>'+
 /* cashier, behind the counter */
 '<g id="cashier"><path d="M880 470 L886 340 Q890 296 940 296 Q990 296 994 340 L1000 470Z" fill="#c4672f"/><path d="M908 340h64l8 130h-80z" fill="#f6f4ee"/>'+line('cArmB',24,'#a9531f')+
  '<g id="cHead"><rect x="927" y="262" width="26" height="40" rx="10" fill="#c98e66"/><circle cx="940" cy="240" r="42" fill="#d79c72"/><path d="M897 238q-2-50 44-50t42 48q-24-4-34-22q-18 22-52 24z" fill="#2a1d16"/><circle cx="918" cy="244" r="4.5" fill="#2a1d16"/><circle cx="943" cy="244" r="4.5" fill="#2a1d16"/><path id="cMouth" d="M918 264q12 8 24 0" fill="none" stroke="#7a3b2a" stroke-width="4" stroke-linecap="round"/></g></g>'+
 /* customer */
 '<g id="man"><ellipse cx="0" cy="668" rx="82" ry="13" fill="#00000045"/>'+line('legB',34,'#1d2740')+line('armB',22,'#8d5a3d')+
  '<g id="torso"><path d="M-42 480 L-46 372 Q-44 318 4 316 Q50 320 48 372 L40 480Z" fill="#e8e1d3"/><path d="M-42 450h82v34h-82z" fill="#2c3a5c"/>'+
  '<rect x="-10" y="286" width="26" height="36" rx="10" fill="#a86f4b"/><circle cx="6" cy="264" r="42" fill="#b87c55"/><path d="M-37 268q-8-58 48-58q42 2 40 38q-30 2-46-12q-6 26-26 22l-4 18z" fill="#18100c"/><path d="M12 288q18 18 35-4q-2 26-20 24q-14-2-15-20z" fill="#18100c"/><circle cx="30" cy="260" r="4.5" fill="#18100c"/></g>'+
  line('legF',36,'#2c3a5c')+'<path id="shoeB" fill="#15100d"/><path id="shoeF" fill="#241a14"/></g>'+
 /* counter */
 '<rect x="520" y="'+COUNTER+'" width="640" height="26" rx="8" fill="#d9a86a"/><rect x="535" y="'+(COUNTER+26)+'" width="610" height="170" fill="#8f5c31"/><rect x="560" y="520" width="560" height="120" rx="10" fill="#7a4c27"/>'+
 '<text x="840" y="597" text-anchor="middle" font-family="Lz" font-size="54" fill="#f6f4ee" direction="rtl">أواني Store</text>'+
 /* flatbed scanner */
 '<rect x="690" y="'+(COUNTER-9)+'" width="90" height="12" rx="4" fill="#15181e"/><path id="laser" d="M735 463 L705 380 L765 380Z" fill="#ff3b2f" opacity="0"/><rect id="slot" x="702" y="'+(COUNTER-7)+'" width="66" height="5" rx="2" fill="#6b1f1b"/>'+
 /* screen on a stand */
 '<rect x="1086" y="418" width="14" height="52" fill="#20242c"/><rect x="1030" y="318" width="126" height="104" rx="10" fill="#15181e" stroke="#3a4150" stroke-width="4"/><text id="mon" x="1093" y="378" text-anchor="middle" font-family="Lz" font-size="32" fill="#f0b44c">0</text>'+
 '<g id="goods"></g>'+
 /* bag: its front is drawn over the goods so they drop inside */
 '<g id="bag"><path d="M824 392q0-34 30-34t30 34" fill="none" stroke="#b98a55" stroke-width="8"/><path d="M800 388h108l-8 84h-92z" fill="#e0bd8a"/><path d="M800 388h108l-2 16H802z" fill="#c9a26c"/></g>'+
 '<g id="armG">'+line('armF',24,'#b87c55')+line('sleeveF',32,'#d8d0be')+'</g>'+
 '<g>'+line('cArm',26,'#c4672f')+'<circle id="cHand" r="14" fill="#d79c72"/></g><circle id="hand" r="13" fill="#b87c55"/>'+
 '<g id="bubble" opacity="0"><rect x="600" y="120" width="330" height="78" rx="20" fill="#fff"/><path d="M860 196l42 36-6-42z" fill="#fff"/><text id="say" x="765" y="171" text-anchor="middle" font-family="Tj" font-weight="700" font-size="32" fill="#13211f" direction="rtl"></text></g>';
}

/* two-bone limb: returns the path shoulder → elbow → hand */
function limb(a,b,l1,l2,bend){
 let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;const max=l1+l2-.5;
 if(d>max){dx*=max/d;dy*=max/d;d=max;}
 const c=Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))),ang=Math.atan2(dy,dx)+bend*Math.acos(c);
 const m={x:a.x+Math.cos(ang)*l1,y:a.y+Math.sin(ang)*l1},e={x:a.x+dx,y:a.y+dy};
 return {d:'M'+a.x+' '+a.y+'L'+m.x+' '+m.y+'L'+e.x+' '+e.y,elbow:m,end:e};
}
const set=(id,k,v)=>$(id).setAttribute(k,v);

const man={x:-140,phase:0,walk:0,hand:null},clerk={hand:{x:862,y:466}};
const CART_REST=()=>({x:man.x+62,y:468});
function draw(){
 const bob=man.walk*Math.abs(Math.cos(man.phase))*-9;
 set('man','transform','translate('+man.x+' 0)');set('armG','transform','translate('+man.x+' 0)');
 set('torso','transform','translate(0 '+bob+')');
 [['legF','shoeF',0],['legB','shoeB',Math.PI]].forEach(([leg,shoe,o])=>{
  const t=man.phase+o,fx=man.walk*Math.sin(t)*58+(o?-16:14)*(1-man.walk),fy=648-man.walk*Math.max(0,Math.cos(t))*30;
  const l=limb({x:0,y:470+bob},{x:fx,y:fy},94,94,-1);
  set(leg,'d',l.d);set(shoe,'d','M'+(l.end.x-17)+' '+(l.end.y+4)+'q4-16 22-12l30 12q8 12-6 14h-44z');
 });
 const swing=Math.sin(man.phase)*man.walk;
 /* hand position is kept in scene coordinates; local = scene − man.x */
 const target=man.hand?{x:man.hand.x-man.x,y:man.hand.y}:{x:24+swing*45,y:474+bob};
 const sh={x:4,y:352+bob},a=limb(sh,target,96,104,1);
 set('armF','d',a.d);set('sleeveF','d','M'+sh.x+' '+sh.y+'L'+(sh.x+(a.elbow.x-sh.x)*.6)+' '+(sh.y+(a.elbow.y-sh.y)*.6));
 set('hand','cx',a.end.x+man.x);set('hand','cy',a.end.y);
 set('armB','d',limb({x:-14,y:356+bob},{x:-10-swing*45,y:472+bob},92,96,1).d);
 const c=limb({x:905,y:342},clerk.hand,86,92,-1);
 set('cArm','d',c.d);set('cHand','cx',c.end.x);set('cHand','cy',c.end.y);
 set('cArmB','d',limb({x:974,y:342},{x:978,y:462},70,70,-1).d);
}

/* ───── timeline ───── */
let run=0,paused=false;
class Stop extends Error{}
function tween(ms,step,id){return new Promise((ok,no)=>{let t=0,last=performance.now();
 const f=now=>{if(id!==run)return no(new Stop());if(!paused)t+=Math.min(100,now-last);last=now;const k=Math.min(1,t/ms);step(k);draw();k<1?requestAnimationFrame(f):ok();};requestAnimationFrame(f);});}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const lerp=(a,b,k)=>({x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k});

/* a product is positioned by its bottom centre */
function makeGood(key){const g=document.createElementNS(NS,'g');g.innerHTML='<g transform="scale(.3) translate(-200 -318)">'+ART[key]+'</g>';$('goods').appendChild(g);return g;}
const place=(g,p,s=1)=>{g.pos=p;g.setAttribute('transform','translate('+p.x+' '+p.y+') scale('+s+')');};
const GRIP=34; /* the hand holds a product slightly above its base */
const grip=p=>({x:p.x,y:p.y-GRIP});

async function move(from,to,ms,lift,id,fn){await tween(ms,k=>{const e=ease(k),p=lerp(from,to,e);p.y-=Math.sin(Math.PI*e)*lift;fn(p);},id);}

function say(text){$('say').textContent=text;set('bubble','opacity',text?1:0);}
function reset(){
 build();man.x=-140;man.phase=0;man.walk=0;man.hand=null;clerk.hand={x:862,y:466};
 $('lines').innerHTML='';$('total').innerHTML=money(0);$('last').innerHTML='<div class="n">في انتظار الزبون…</div>';draw();
}

async function play(){
 const id=++run;paused=false;$('pause').textContent='إيقاف مؤقت';reset();
 try{
  /* 1. the customer walks in, carrying a basket */
  const basket=document.createElementNS(NS,'g');
  basket.innerHTML='<path d="M-30 0q30-48 60 0" fill="none" stroke="#7f1f14" stroke-width="7"/><path d="M-48 0h96l-12 52h-72z" fill="#b8402f"/><path d="M-40 16h80M-36 32h72" stroke="#7f1f14" stroke-width="4"/>';
  scene.insertBefore(basket,$('bubble'));
  const carry=()=>basket.setAttribute('transform','translate('+$('hand').getAttribute('cx')+' '+(+$('hand').getAttribute('cy')+34)+')');
  await tween(3600,k=>{const x=-140+(450+140)*k;man.phase=(x+140)/36;man.walk=Math.min(1,(1-k)*6);man.x=x;draw();carry();},id);
  man.walk=0;say('السلام عليكم');await tween(1100,carry,id);say('');

  /* 2. he puts the basket down and hands over the products one by one */
  const restHand={x:man.x+24,y:474},down={x:548,y:430};
  await move(restHand,down,700,30,id,p=>{man.hand=p;draw();carry();});
  basket.setAttribute('transform','translate(548 '+(COUNTER-52)+')');
  const goods=[],slots=[668,622,576,530].map(x=>({x:x-4,y:COUNTER}));
  for(let i=0;i<PRODUCTS.length;i++){
   await move(man.hand,{x:548,y:412},300,0,id,p=>man.hand=p);
   const g=makeGood(PRODUCTS[i].img);goods.push(g);
   const start={x:548,y:412+GRIP},end=slots[i];
   await move(start,end,650,i?55:90,id,p=>{place(g,p);man.hand=grip(p);});
  }
  basket.remove();
  await move(man.hand,{x:man.x+30,y:474},550,20,id,p=>man.hand=p);man.hand=null;

  /* 3. the cashier takes each product, scans it and bags it */
  let total=0;
  $('last').innerHTML='<div class="n">جاهز للمسح</div>';
  for(let i=0;i<PRODUCTS.length;i++){
   const g=goods[i],p=PRODUCTS[i];
   await move(clerk.hand,grip(g.pos),500,40,id,h=>clerk.hand=h);
   const over={x:SCAN.x,y:SCAN.y-24};
   await move(g.pos,over,600,50,id,q=>{place(g,q);clerk.hand={x:q.x+20,y:q.y-GRIP};});
   set('laser','opacity',.55);set('slot','fill','#ff3b2f');
   await tween(260,()=>{},id);
   beep();total+=p.price;
   $('last').innerHTML='<div class="n">'+p.name+'</div><div class="p">'+money(p.price)+'</div>';
   $('last').classList.remove('hit');void $('last').offsetWidth;$('last').classList.add('hit');
   $('lines').insertAdjacentHTML('beforeend','<li><span>'+p.name+'</span><b>'+money(p.price)+'</b></li>');
   $('total').innerHTML=money(total);$('mon').textContent=String(total).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
   await tween(520,()=>{},id);
   set('laser','opacity',0);set('slot','fill','#6b1f1b');
   await move(over,{x:854,y:COUNTER-6},600,95,id,q=>{place(g,q,1-.35*Math.max(0,(q.x-780)/74));clerk.hand={x:q.x+14,y:q.y-GRIP};});
   g.remove();
  }
  await move(clerk.hand,{x:862,y:466},500,20,id,h=>clerk.hand=h);
  $('last').innerHTML='<div class="n">المبلغ المستحق</div><div class="p">'+money(total)+'</div>';
  say('المجموع \u2066'+String(total).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+'\u2069 د.ج');
  window.finished=true;
 }catch(e){if(!(e instanceof Stop))throw e;}
}
$('replay').onclick=play;
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'متابعة':'إيقاف مؤقت';};
$('sound').onclick=()=>{soundOn=!soundOn;if(soundOn){audio=audio||new AudioContext();audio.resume();beep();}$('sound').textContent=soundOn?'كتم الصوت':'تشغيل الصوت';};
document.fonts.ready.then(play);
</script></body></html>
